name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish BeamSplit.csproj -c Release -r win-x64 --self-contained true -o staging/publish
      - name: Self-test and package
        shell: pwsh
        run: |
          $output = Join-Path (Resolve-Path ./staging) 'selftest.txt'
          $process = Start-Process -FilePath ./staging/publish/BeamSplit.exe `
            -ArgumentList @('--selftest', $output) -PassThru -Wait -WindowStyle Hidden
          if (Test-Path $output) { Get-Content $output }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (-not (Test-Path $output)) { throw 'BeamSplit self-test produced no report.' }
          $files = @('BeamSplit.exe','README.md','LICENSE','PRIVACY.md','THIRD-PARTY.md','THIRD-PARTY-NOTICES.txt')
          New-Item -ItemType Directory -Force ./staging/package | Out-Null
          Copy-Item ./staging/publish/BeamSplit.exe ./staging/package/
          foreach ($file in $files | Select-Object -Skip 1) { Copy-Item $file ./staging/package/ }
          Compress-Archive ./staging/package/* ./staging/BeamSplit-portable.zip
          Get-FileHash ./staging/package/BeamSplit.exe, ./staging/BeamSplit-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii ./staging/SHA256SUMS.txt
      - name: Attest executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: staging/package/BeamSplit.exe
      - name: Attest portable ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: staging/BeamSplit-portable.zip
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes ./staging/package/BeamSplit.exe ./staging/BeamSplit-portable.zip ./staging/SHA256SUMS.txt
