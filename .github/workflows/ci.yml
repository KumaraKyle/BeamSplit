name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BeamSplit.csproj
      - name: Build
        run: dotnet build BeamSplit.csproj -c Release --no-restore
      - name: Dependency vulnerability report
        run: dotnet list BeamSplit.csproj package --vulnerable --include-transitive
      - name: Publish portable build
        run: dotnet publish BeamSplit.csproj -c Release -r win-x64 --self-contained true -o staging/publish --no-restore
      - name: Shipping self-test
        shell: pwsh
        run: |
          $output = Join-Path (Resolve-Path ./staging) 'selftest.txt'
          $process = Start-Process -FilePath ./staging/publish/BeamSplit.exe `
            -ArgumentList @('--selftest', $output) -PassThru -Wait -WindowStyle Hidden
          if (Test-Path $output) { Get-Content $output }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (-not (Test-Path $output)) { throw 'BeamSplit self-test produced no report.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BeamSplit-ci-${{ github.sha }}
          path: |
            staging/publish/BeamSplit.exe
            staging/selftest.txt
