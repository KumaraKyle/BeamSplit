name: Bug report
description: Report a reproducible BeamSplit problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste a BeamMP AuthKey. Create a redacted support bundle from the Console.
  - type: input
    id: version
    attributes: { label: BeamSplit version }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Windows, BeamNG and BeamMP versions }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: What happened and exact reproduction steps }
    validations: { required: true }
  - type: textarea
    id: hardware
    attributes: { label: Controllers, monitors and relevant hardware }
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I inspected my attachments and removed credentials.
          required: true
